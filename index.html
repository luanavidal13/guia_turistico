<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Turístico de Blumenau</title>

    <meta name="description"
          content="Um guia para facilitar visitas em Blumenau"  
    />

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Blumenau Explorer</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Favoritos</a>
        </nav>
    </header>

    <main>
        <section class="intro">
            <h2>Descubra Blumenau</h2>
            <p>Guia simples, rápido e assessível para cidade</p>
        </section>

        <section class="lista">
            <article class="card">
                <img src="http://picsum.photos/400/250" 
                     alt="">

                     <div>
                        <h3>Parque Vila Germânica</h3>
                        <p>Principal espaço de evento da cidade</p>
                        <button>Favoritar</button>
                     </div>
            </article>

             <article class="card">
                <img src="http://picsum.photos/400/250" 
                     alt="">

                     <div>
                        <h3>Rua XV de Novembro</h3>
                        <p>Centro Histório</p>
                        <button>Favoritar</button>
                     </div>
            </article>

             <article class="card">
                <img src="http://picsum.photos/400/250" 
                     alt="">

                     <div>
                        <h3>Padaria Bublitz</h3>
                        <p>Melhor padaria da cidade</p>
                        <button>Favoritar</button>
                     </div>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; Luana Vidal Teixeira </p>
    </footer>
    
</body>
</html>
